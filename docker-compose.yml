services:
  postgres:
    image: postgres:16-alpine
    container_name: helploop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helploop
      POSTGRES_PASSWORD: helploop
      POSTGRES_DB: helploop
    ports:
      - "5432:5432"
    volumes:
      - helploop_pg:/var/lib/postgresql/data

volumes:
  helploop_pg:
